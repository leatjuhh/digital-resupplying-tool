name: CI

# Quality gates (Fase 2, PR-011). Zie docs/engineering/PRODUCTION_READINESS_PLAN.md
# en hoofdstuk 11 van PRODUCTION_ENGINEERING_STANDARD.md.
# Regel: een pull request MAG NIET mergen bij een falende verplichte gate.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint) — verplichte gate
        run: ruff check .

      - name: Mypy (Kritiek-domeinlaag) — verplichte gate
        # De kritieke domeinlaag redistribution/ is type-schoon en wordt daarom
        # blokkerend getypecheckt (R10.1, risicoklasse Kritiek — hoofdstuk 14).
        run: mypy redistribution/

      - name: Mypy (volledige backend) — informatief
        # Niet-blokkerende baseline: de router-/legacy-laag heeft nog een
        # baseline aan (grotendeels SQLAlchemy-Column) typefouten. Wordt
        # module-voor-module opgeschoond en blokkerend gemaakt.
        run: mypy .
        continue-on-error: true

      - name: Pytest (unit + security) — verplichte gate
        # Expliciete lijst van reproduceerbare tests; de procedurele/legacy
        # scripts en de seed-afhankelijke integratietests draaien pas in CI
        # zodra er een geseede testomgeving is (Fase 4).
        run: |
          pytest -q \
            test_bundle_planner.py \
            test_algorithm_config_injection.py \
            test_artikel_voorraad_constraint.py \
            test_store_sorting.py \
            test_situation_classifier.py \
            test_offline_situation_evaluation.py \
            test_algorithm_import_service.py \
            test_proposal_data_mapping.py \
            test_pdf_ingest_service.py \
            test_security_hardening.py \
            test_rate_limit.py \
            test_redistribution_invariants.py

  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installeer dependencies
        run: npm ci

      - name: TypeScript typecheck — verplichte gate
        run: npx tsc --noEmit

      - name: ESLint (next lint) — verplichte gate
        run: npm run lint

      - name: Build (met type-validatie, zonder ignoreBuildErrors) — verplichte gate
        run: npm run build
